// Adds independent width/height/length scaling (ModuleIntakeScale) to every intake part -- the stock
// intakes and any modded ones -- so a single fixed-mesh intake covers a range of sizes. Excludes engine
// parts (built-in intakes like the Goliath). The AJE frontal-area hook is a no-op in pure-stock installs.
//
// lengthAxis (x|y|z) tells the module which model-local axis is the airflow/length direction; the other
// two are width & height (frontal capture area). Meshes vary in orientation, so the outliers are tuned
// per-part below; the default assumes the model's length runs along its local Y (stack) axis.

// --- AJE / SolverEngines installed: intakes have been renamed to AJEInlet ---
@PART[*]:HAS[@MODULE[AJEInlet],!MODULE[ModuleEngines*],!MODULE[ModuleCommand]]:NEEDS[AJE|SolverEngines]:AFTER[AJE]
{
	MODULE
	{
		name = ModuleIntakeScale
		lengthAxis = y
	}
}

// --- pure stock (no AJE): plain ModuleResourceIntake ---
@PART[*]:HAS[@MODULE[ModuleResourceIntake],!MODULE[ModuleEngines*],!MODULE[ModuleCommand]]:NEEDS[!AJE&!SolverEngines]:LAST[ProceduralParts]
{
	MODULE
	{
		name = ModuleIntakeScale
		lengthAxis = y
	}
}

// --- per-part orientation overrides (tuned in-game where the default y-axis length is wrong) ---
// NOTE: these match the PART *name*, not the cfg filename. The XM-G50's part name is "airScoop".
// Both radial intakes mount on their side, so their airflow/length axis is local Z (not the default Y).
// Run in :FINAL (after both add-the-module passes above, including the stock LAST[ProceduralParts] one)
// so the HAS[@MODULE[ModuleIntakeScale]] guard is guaranteed to see the module.
@PART[airScoop]:HAS[@MODULE[ModuleIntakeScale]]:FINAL         { @MODULE[ModuleIntakeScale] { @lengthAxis = z } }
@PART[IntakeRadialLong]:HAS[@MODULE[ModuleIntakeScale]]:FINAL  { @MODULE[ModuleIntakeScale] { @lengthAxis = z } }
